name: Pages preview → Hostnet deploy (app.groei-sterker.nl)

# Zelfde werkwijze als de website:
# 1. Elke push naar master komt eerst op GitHub Pages (https://darker19.github.io/groei-sterker-moves/) om na te kijken.
# 2. Daarna wacht de Hostnet-stap op goedkeuring (omgeving "production") en pas dan gaat het via FTP naar app.groei-sterker.nl.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVER_DIR: "/customers/3/b/0/cebjgz0mr/webroots/sites/app.groei-sterker.nl/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for commit summary)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discord — Groei Sterker Moves deploy gestart
        continue-on-error: true
        run: |
          CHANGES=$(git log -5 --pretty=format:"• %s" | sed ':a;N;$!ba;s/\n/\\n/g')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"📱 Groei Sterker Moves — Deploy gestart\",
                \"description\": \"**Wijzigingen (laatste 5 commits):**\\n$CHANGES\\n\\nRun: $RUN_URL\",
                \"color\": 3447003
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Prepare clean deploy folder (exclude junk)
        run: |
          mkdir -p deploy
          rsync -av --delete \
            --exclude='deploy/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='README.md' \
            --exclude='.vscode/' \
            --exclude='node_modules/' \
            ./ deploy/
          # GitHub Pages draait geen PHP: de preview krijgt de API niet mee en werkt als demo
          rsync -a --exclude='api/' deploy/ pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: deploy
          # anders gaan .htaccess en api/.htaccess (https, headers, afscherming api/) niet mee naar Hostnet
          include-hidden-files: true

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Discord — Groei Sterker Moves op GitHub Pages (nakijken)
        if: success()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"📱 Groei Sterker Moves — Klaar om na te kijken\",
                \"description\": \"Preview: ${{ steps.deployment.outputs.page_url }}\\n\\nAlles goed? Keur de Hostnet-stap goed:\\n$RUN_URL\",
                \"color\": 3066993
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord — Groei Sterker Moves GitHub Pages gefaald
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"📱 Groei Sterker Moves — GitHub Pages gefaald\", \"description\": \"Run: $RUN_URL\", \"color\": 15158332}]}" \
            "${{ secrets.DISCORD_WEBHOOK }}"

  deploy_hostnet:
    needs: deploy_pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.groei-sterker.nl/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: app-dist
          path: site

      # De databasegegevens komen uit de GitHub-secrets en staan nooit in git.
      # var_export zorgt dat bijzondere tekens in wachtwoorden goed in het PHP-bestand komen.
      - name: API-instellingen aanmaken (config.php)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          # Nog geen database ingesteld? Dan geen config.php: de app draait dan als demo (opslag in de browser)
          if [ -z "$DB_HOST" ]; then echo "::notice::Geen database-secrets: API niet ingesteld, app draait als demo"; exit 0; fi
          php -r '
            $c = ["db_host"=>getenv("DB_HOST"), "db_name"=>getenv("DB_NAME"), "db_user"=>getenv("DB_USER"),
                  "db_pass"=>getenv("DB_PASS"), "setup_code"=>getenv("SETUP_CODE"), "data_key"=>(string)getenv("DATA_KEY"), "cookie_secure"=>true];
            if ($c["data_key"] !== "" && strlen((string)base64_decode($c["data_key"], true)) !== 32) { fwrite(STDERR, "DATA_KEY moet base64 van 32 bytes zijn (openssl rand -base64 32)\n"); exit(1); }
            foreach (["db_host","db_name","db_user"] as $k) if ($c[$k] === "" || $c[$k] === false) { fwrite(STDERR, "Secret ontbreekt: ".strtoupper($k)."\n"); exit(1); }
            file_put_contents("site/api/config.php", "<?php\nreturn " . var_export($c, true) . ";\n");'
          php -l site/api/config.php

      # FTP over TLS (FTPS): wachtwoord en config.php (met DATA_KEY) gaan versleuteld over internet.
      # Met lftp, omdat FTP-Deploy-Action bij FTPS de servernaam (SNI) niet meestuurt en Hostnet dan de TLS-verbinding weigert.
      # SFTP_HOST moet daarom de hostnaam zijn (ftp.cebjgz0mr.service.one), geen IP-adres.
      - name: FTPS deploy to Hostnet
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set net:max-retries 2; set net:timeout 30; set cmd:fail-exit true;
            mirror -R --verbose --parallel=4 site/ $SERVER_DIR;
            rm -f $SERVER_DIR.ftp-deploy-sync-state.json;
            bye"

      - name: Discord — Groei Sterker Moves live op app.groei-sterker.nl
        if: success()
        continue-on-error: true
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"📱 Groei Sterker Moves — Live\", \"description\": \"https://app.groei-sterker.nl/ is bijgewerkt ✅\", \"color\": 3066993}]}" \
            "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Discord — Groei Sterker Moves Hostnet gefaald
        if: failure()
        continue-on-error: true
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"embeds\": [{\"title\": \"📱 Groei Sterker Moves — Hostnet deploy gefaald ❌\", \"description\": \"Run: $RUN_URL\", \"color\": 15158332}]}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
